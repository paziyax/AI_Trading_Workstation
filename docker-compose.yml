# Convenience wrapper equivalent to scripts/start_* + docker run.
#   docker compose up -d --build
#   docker compose down            # keeps the finally-data volume
services:
  finally:
    build:
      context: .
      dockerfile: Dockerfile
    image: finally:latest
    container_name: finally
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - finally-data:/app/db
    restart: unless-stopped
    healthcheck:
      # Same probe as the Dockerfile HEALTHCHECK (stdlib only, no curl).
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # Explicit name so Compose, the scripts and scripts/README.md all share the
  # same volume instead of a project-name-prefixed one.
  finally-data:
    name: finally-data
