name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/deepseek/deepseek-v4.1-flash-1017
          prompt: |
            Review this pull request.
            - Flag bugs, logic errors, and missing edge cases
            - Check the code matches AGENTS.md and planning/PLAN.md
            - Be concise: bullet points, no praise, no restating the diff
            - If the PR is fine, reply with a single line saying so